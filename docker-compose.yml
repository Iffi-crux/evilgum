version: '3.8'

services:
  mcp-firewall:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - UPSTREAM_MCP_URL=http://mock-mcp-backend:9090/rpc
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite+aiosqlite:///data/admin.db
    depends_on:
      - mock-mcp-backend
      - redis
    volumes:
      - ./data:/app/data
    restart: always

  mock-mcp-backend:
    build:
      context: .
      dockerfile: Dockerfile.mock
    ports:
      - "9090:9090"
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always
