name: Deploy marketing site to GitHub Pages

# Publishes site/ to GitHub Pages on every push to main.
# After the first successful run, enable Pages once in the repo:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The public URL will be https://faseel.github.io/evilgum/ (or your custom domain).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
