# EvilGum load balancer — round-robins across gateway replicas and drops any
# replica whose /readyz stops answering. Docker's embedded DNS resolves the
# `gateway` service name to every replica's IP.
worker_processes auto;
events { worker_connections 2048; }

http {
  resolver 127.0.0.11 valid=10s;             # Docker embedded DNS
  upstream gateway_pool {
    zone gateway_pool 64k;
    server gateway:8080 max_fails=2 fail_timeout=10s;
    keepalive 32;
  }

  # Basic request-rate ceiling at the edge (defence in depth; the gateway also
  # rate-limits per session).
  limit_req_zone $binary_remote_addr zone=edge:10m rate=100r/s;

  server {
    listen 8080;

    # Health of the LB itself.
    location = /lb-health { return 200 "ok\n"; }

    # Never expose metrics to the public edge — scrape it in-mesh only.
    location = /metrics { return 404; }

    location / {
      limit_req zone=edge burst=200 nodelay;
      proxy_pass http://gateway_pool;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
    }
  }
}
