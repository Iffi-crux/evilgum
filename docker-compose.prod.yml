# PRODUCTION compose (AG-18): NO mock backend, secrets from the environment, and
# the gateway refuses to start without safe identity/mTLS/macaroon config.
# Use the base docker-compose.yml only for local dev (it includes the mock server).
services:
  mcp-firewall:
    image: evilgum:0.1.0rc1
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - GATEWAY_ENV=prod
      - GATEWAY_JWT_ALG=RS256
      - GATEWAY_JWT_PUBLIC_KEY=${GATEWAY_JWT_PUBLIC_KEY}      # PEM from your IdP
      - GATEWAY_JWT_AUDIENCE=${GATEWAY_JWT_AUDIENCE}
      - GATEWAY_JWT_ISSUER=${GATEWAY_JWT_ISSUER}
      - MACAROON_ROOT_KEY=${MACAROON_ROOT_KEY}                # >=32 bytes, from secrets mgr
      - UPSTREAM_MCP_URL=${UPSTREAM_MCP_URL}
      - UPSTREAM_TLS_VERIFY=true
      - UPSTREAM_CA_BUNDLE=/run/secrets/upstream_ca.pem
      - CLIENT_CERT=/run/secrets/client.crt
      - CLIENT_KEY=/run/secrets/client.key                    # mounted secret, NOT in the image
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      - DATABASE_URL=sqlite+aiosqlite:////app/data/admin.db
      - EVILGUM_DATA_DIR=/app/data
      - AUDIT_LOG_PATH=/app/data/audit.log.jsonl
      - SCHEMA_LOCK_PATH=/app/mcp-lock.json
      - SCHEMA_LOCK_ENFORCE=true
      - TAINT_MODE=coarse
      - GATEWAY_ENFORCEMENT_MODE=enforce
      - SCHEMA_LOCK_LEARN=false
      - WEBHOOK_URL=${WEBHOOK_URL}
    secrets:
      - upstream_ca.pem
      - client.crt
      - client.key
    restart: always
    read_only: true
    volumes:
      - gateway-data:/app/data
      - ./mcp-lock.json:/app/mcp-lock.json:ro
    depends_on:
      - redis
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

  redis:
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "--appendonly", "yes", "--appendfsync", "always"]
    volumes:
      - redis-data:/data
    restart: always

volumes:
  gateway-data:
  redis-data:

secrets:
  upstream_ca.pem:
    file: ./secrets/upstream_ca.pem
  client.crt:
    file: ./secrets/client.crt
  client.key:
    file: ./secrets/client.key
